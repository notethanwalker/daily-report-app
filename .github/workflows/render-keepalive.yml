name: Render Keepalive

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/render-keepalive.yml'
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ping-render:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - name: Keep Daily Report API awake
        shell: bash
        run: |
          set -u
          for i in $(seq 1 70); do
            date -u
            curl --silent --show-error --location --max-time 90 \
              --retry 3 --retry-delay 5 \
              -A "daily-report-import-keepalive" \
              https://daily-report-api-ero2.onrender.com/ >/dev/null || true
            sleep 300
          done
