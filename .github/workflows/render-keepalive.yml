name: Render Keepalive

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ping-render:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Ping Daily Report API
        run: |
          curl --fail-with-body --location --max-time 90 \
            --retry 2 --retry-delay 5 \
            -A "daily-report-import-keepalive" \
            https://daily-report-api-ero2.onrender.com/docs >/dev/null
