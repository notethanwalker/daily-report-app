name: Render Keepalive

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/render-keepalive.yml'
  schedule:
    # Keep the service warm without using the heavily contended :00/:10 cron slots.
    - cron: '3,13,23,33,43,53 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # v2 intentionally isolates new runs from a stale legacy concurrency record.
  group: render-keepalive-v2
  cancel-in-progress: true

jobs:
  ping-render:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Keep Daily Report API awake
        shell: bash
        run: |
          set -euo pipefail
          date -u
          curl --fail --silent --show-error --location --max-time 60 \
            --retry 2 --retry-delay 3 \
            -A "daily-report-import-keepalive" \
            https://daily-report-api-ero2.onrender.com/ >/dev/null
