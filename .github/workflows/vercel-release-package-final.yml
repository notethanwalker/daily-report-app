name: Vercel Final Release Package Once
on:
  push:
    branches: [vercel-release-20260910-final]
    paths: ['.github/workflows/vercel-release-package-final.yml']
permissions:
  contents: write
jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - name: Package exact web source
        run: |
          set -euo pipefail
          WEB_TREE=$(git rev-parse HEAD:web)
          echo "Packaging web tree ${WEB_TREE} from ${GITHUB_SHA}."
          tar -czf vercel-web-source.tgz web
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f vercel-web-source.tgz
          git commit -m "Package final web source for manual Vercel release"
          git push origin HEAD:vercel-release-20260910-final
