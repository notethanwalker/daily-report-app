name: Harden Stooq recovery importer

on:
  push:
    branches:
      - database-rebuild-neon-20260909
    paths:
      - .github/workflows/harden-stooq-recovery.yml

permissions:
  contents: write

jobs:
  harden:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: database-rebuild-neon-20260909
      - name: Patch durable importer
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('backend/app/services/stooq_durable_import.py')
          s = p.read_text()
          old = '    prune_market_snapshots,\n)'
          new = '    prune_market_snapshots,\n    prune_normalized_bars,\n)'
          if new not in s:
              if old not in s:
                  raise SystemExit('import anchor not found')
              s = s.replace(old, new, 1)
          old2 = '    if complete:\n        prune_market_snapshots(db)\n        db.execute(text("DELETE FROM stooq_import_chunks WHERE upload_id=:id"), {"id": upload_id})'
          new2 = '    if complete:\n        prune_market_snapshots(db)\n        prune_normalized_bars(db, keep_per_symbol=NORMALIZED_HISTORY_DAYS)\n        db.execute(text("DELETE FROM stooq_import_chunks WHERE upload_id=:id"), {"id": upload_id})'
          if new2 not in s:
              if old2 not in s:
                  raise SystemExit('completion anchor not found')
              s = s.replace(old2, new2, 1)
          p.write_text(s)
          PY
          python -m py_compile backend/app/services/stooq_durable_import.py
      - name: Commit hardening
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add backend/app/services/stooq_durable_import.py
          git commit -m "Prune normalized history after durable Stooq import"
          git push origin HEAD:database-rebuild-neon-20260909
