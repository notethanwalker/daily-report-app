name: Pass4 Fix Once
on:
  push:
    branches: [design-philosophy-hardening-20260909]
    paths: [".github/workflows/pass4-fix-once.yml"]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {ref: design-philosophy-hardening-20260909}
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - name: Apply fixes
        run: |
          python - <<'PY'
          from pathlib import Path

          p=Path('web/app/v4/page.tsx');s=p.read_text()
          s=s.replace('type Deployment={basket:string;capital:number;eligible:any[];unavailable:any[];methodology:string;model:string};','type Deployment={basket:string;capital:number;eligible:any[];unavailable:any[];methodology:string;model:string;fundamental_score_policy?:string};')
          p.write_text(s)

          p=Path('web/app/v4/v4.css');s=p.read_text().replace('align-items:end','align-items:flex-end')
          p.write_text(s)

          p=Path('backend/app/providers/gdelt.py');s=p.read_text()
          s=s.replace('def _google_news_fallback(query: str, max_records: int) -> list[dict]:\n    params = {\n        "q": _google_query(query),','def _google_news_fallback(query: str, max_records: int, timespan: str = "24h") -> list[dict]:\n    span=str(timespan or "24h").lower(); suffix=""\n    if span.endswith("h"):\n        try:\n            hours=max(1,int(span[:-1])); days=max(1,(hours+23)//24); suffix=f" when:{days}d"\n        except ValueError: pass\n    elif span.endswith("d"):\n        suffix=f" when:{span}"\n    params = {\n        "q": _google_query(query) + suffix,')
          s=s.replace('_google_news_fallback(query, max_records)','_google_news_fallback(query, max_records, timespan)')
          s=s.replace('_google_news_fallback(query, max(10, max_records // 2))','_google_news_fallback(query, max(10, max_records // 2), timespan)')
          s=s.replace('_google_news_fallback(query, max_records=max(12, max_records // 2))','_google_news_fallback(query, max_records=max(12, max_records // 2), timespan=timespan)')
          p.write_text(s)

          p=Path('backend/tests/test_design_philosophy_contract.py');s=p.read_text()
          s=s.replace('MAIN = (ROOT / "backend/app/main.py").read_text(encoding="utf-8")','MAIN = (ROOT / "backend/app/main.py").read_text(encoding="utf-8")\nGDELT = (ROOT / "backend/app/providers/gdelt.py").read_text(encoding="utf-8")')
          s=s.replace('self.assertIn(\'timespan=f"{hours}h"\', MAIN)','self.assertIn(\'timespan=f"{hours}h"\', MAIN)\n        self.assertIn(\'suffix=f" when:{days}d"\', GDELT)\n        self.assertIn(\'_google_news_fallback(query, max_records, timespan)\', GDELT)')
          p.write_text(s)
          PY
      - name: Compile
        run: python -m py_compile backend/app/providers/gdelt.py backend/tests/test_design_philosophy_contract.py
      - name: Commit
        run: |
          git config user.name "daily-report-bot"
          git config user.email "actions@users.noreply.github.com"
          git add web/app/v4/page.tsx web/app/v4/v4.css backend/app/providers/gdelt.py backend/tests/test_design_philosophy_contract.py
          git commit -m "Fix V4 type contract and news fallback windows"
          git push origin HEAD:design-philosophy-hardening-20260909
