name: Generate web lockfile

on:
  push:
    branches: [exhaustive-audit-pass3-fixes]

permissions:
  contents: write

concurrency:
  group: generate-web-lock
  cancel-in-progress: true

jobs:
  lock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: exhaustive-audit-pass3-fixes
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Generate lockfile if missing
        shell: bash
        run: |
          set -euo pipefail
          if [ -f web/package-lock.json ]; then
            echo "Lockfile already committed."
            exit 0
          fi
          cd web
          npm install --package-lock-only --ignore-scripts
          cd ..
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add web/package-lock.json
          git commit -m "Lock frontend dependency graph"
          git push origin HEAD:exhaustive-audit-pass3-fixes
