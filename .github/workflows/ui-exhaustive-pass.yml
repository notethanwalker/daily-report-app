name: UI Exhaustive Pass
on:
  push:
    branches: [ui-exhaustive-pass-20260909]
    paths:
      - 'web/preflight-ui-exhaustive-v5.mjs'
      - '.github/workflows/ui-exhaustive-pass.yml'
permissions:
  contents: read
jobs:
  exhaustive:
    strategy:
      fail-fast: false
      matrix:
        viewport:
          - { name: desktop-1440, width: 1440, height: 1000 }
          - { name: desktop-1024, width: 1024, height: 768 }
          - { name: mobile-430, width: 430, height: 932 }
          - { name: mobile-390, width: 390, height: 844 }
          - { name: mobile-375, width: 375, height: 812 }
    name: exhaustive (${{ matrix.viewport.name }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package.json
      - name: Install app dependencies
        working-directory: web
        run: npm install
      - name: Install Playwright
        working-directory: web
        run: |
          npm install --no-save playwright
          npx playwright install chromium
      - name: Build app
        working-directory: web
        run: npm run build
      - name: Start app
        working-directory: web
        run: |
          nohup npm run start -- -H 0.0.0.0 -p 3000 > /tmp/daily-report-next.log 2>&1 &
          for i in {1..60}; do curl -fsS http://127.0.0.1:3000/v4 >/dev/null && exit 0; sleep 1; done
          cat /tmp/daily-report-next.log
          exit 1
      - name: Run isolated per-element browser audit
        working-directory: web
        env:
          UI_VIEWPORT_NAME: ${{ matrix.viewport.name }}
          UI_VIEWPORT_WIDTH: ${{ matrix.viewport.width }}
          UI_VIEWPORT_HEIGHT: ${{ matrix.viewport.height }}
        run: node preflight-ui-exhaustive-v5.mjs
      - name: Upload exhaustive report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-exhaustive-${{ matrix.viewport.name }}
          path: web/preflight-exhaustive-v3-report.json
          retention-days: 3
