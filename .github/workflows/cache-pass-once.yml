name: Cache Pass Once
on:
  push:
    branches: [ui-cache-validation-20260909]
    paths: [".github/workflows/cache-pass-once.yml"]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {ref: ui-cache-validation-20260909}
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - name: Patch fundamentals queue eligibility
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('backend/app/services/refresh_scheduler.py');s=p.read_text()
          marker='''def enqueue_stale(db):\n'''
          helper='''def _fundamentals_supported(db, symbol):\n    row = db.get(SymbolRegistry, str(symbol).upper())\n    if not row or not row.asset_type:\n        return str(symbol).upper() != "VIX"\n    return str(row.asset_type).strip().lower() in {"stock", "equity"}\n\n\n'''
          if helper not in s:
              if marker not in s: raise SystemExit('enqueue marker missing')
              s=s.replace(marker,helper+marker,1)
          old='''        if not fundamental or is_stale(fundamental.retrieved_at, "fundamentals", now):\n            _enqueue(db, symbol, "fundamentals", FRESHNESS_POLICIES["fundamentals"].priority)'''
          new='''        if _fundamentals_supported(db, symbol) and (not fundamental or is_stale(fundamental.retrieved_at, "fundamentals", now)):\n            _enqueue(db, symbol, "fundamentals", FRESHNESS_POLICIES["fundamentals"].priority)'''
          if old not in s: raise SystemExit('fundamentals enqueue block missing')
          s=s.replace(old,new,1)
          p.write_text(s)
          PY
      - name: Compile
        run: python -m py_compile backend/app/services/refresh_scheduler.py
      - name: Commit
        run: |
          git config user.name "daily-report-bot"
          git config user.email "actions@users.noreply.github.com"
          git add backend/app/services/refresh_scheduler.py
          git commit -m "Avoid fundamental refreshes for ETFs and indexes"
          git push origin HEAD:ui-cache-validation-20260909
