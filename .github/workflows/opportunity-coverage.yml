# Coverage worker: broad bootstrap transitions automatically to incremental maintenance at 95%.
name: Opportunity Coverage Expansion

on:
  workflow_dispatch:
    inputs:
      limit:
        description: "Maximum missing or stale symbols to attempt"
        required: false
        default: "1000"
  # Run hourly at minute 17; manual dispatch remains available.
  schedule:
    - cron: "17 * * * *"
  push:
    paths:
      - ".github/workflows/opportunity-coverage.yml"
      - "scripts/opportunity_bulk_worker.py"

concurrency:
  group: opportunity-coverage-expansion
  cancel-in-progress: false

jobs:
  expand-coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      id-token: write
    env:
      DAILY_REPORT_API_BASE: https://daily-report-api-ero2.onrender.com
      PYTHONUNBUFFERED: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install market worker dependencies
        run: python -m pip install --disable-pip-version-check "yfinance>=0.2.54" "pandas>=2.2"

      - name: Expand or refresh Opportunity coverage
        env:
          INPUT_LIMIT: ${{ github.event.inputs.limit }}
        run: |
          LIMIT="${INPUT_LIMIT:-1000}"
          python scripts/opportunity_bulk_worker.py --limit "$LIMIT" --download-chunk 80 --upload-batch 200 --sleep 0.5
