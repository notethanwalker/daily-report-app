name: Opportunity Coverage Expansion

on:
  workflow_dispatch:
    inputs:
      limit:
        description: "Maximum missing symbols to attempt"
        required: false
        default: "250"
  schedule:
    - cron: "17 * * * *"
  push:
    paths:
      - ".github/workflows/opportunity-coverage.yml"
      - "scripts/opportunity_bulk_worker.py"

concurrency:
  group: opportunity-coverage-expansion
  cancel-in-progress: false

jobs:
  expand-coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    permissions:
      contents: read
      id-token: write
    env:
      DAILY_REPORT_API_BASE: https://daily-report-api-ero2.onrender.com
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install market worker dependencies
        run: python -m pip install --disable-pip-version-check "yfinance>=0.2.54" "pandas>=2.2"

      - name: Acquire short-lived GitHub identity token
        shell: bash
        run: |
          set -euo pipefail
          response=$(curl --fail --silent --show-error \
            -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=daily-report-opportunity-ingest")
          token=$(printf '%s' "$response" | python -c 'import json,sys; print(json.load(sys.stdin)["value"])')
          test -n "$token"
          echo "::add-mask::$token"
          echo "OPPORTUNITY_OIDC_TOKEN=$token" >> "$GITHUB_ENV"

      - name: Expand or refresh Opportunity coverage
        env:
          INPUT_LIMIT: ${{ github.event.inputs.limit }}
        run: |
          LIMIT="${INPUT_LIMIT:-250}"
          python scripts/opportunity_bulk_worker.py --limit "$LIMIT" --download-chunk 15 --upload-batch 25 --sleep 2
