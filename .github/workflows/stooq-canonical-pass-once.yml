name: Stooq Canonical Pass Once
on:
  push:
    branches: [ui-cache-validation-20260909]
    paths: [".github/workflows/stooq-canonical-pass-once.yml"]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {ref: ui-cache-validation-20260909}
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - name: Require measured Stooq coverage before canonical status
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('backend/app/services/stooq_durable_import.py');s=p.read_text()
          old='''    canonical_state = {\n        "status": "ready" if complete else "importing",\n        "canonical": bool(complete),'''
          new='''    registry_count = len(registry_rows)\n    coverage_percent = round((matched_total / registry_count) * 100.0, 2) if registry_count else 0.0\n    canonical_min_coverage = float(os.getenv("STOOQ_CANONICAL_MIN_COVERAGE_PERCENT", "80"))\n    canonical_ready = bool(complete and registry_count and coverage_percent >= canonical_min_coverage)\n    canonical_state = {\n        "status": "ready" if complete else "importing",\n        "canonical": canonical_ready,'''
          if old not in s: raise SystemExit('canonical state marker missing')
          s=s.replace(old,new,1)
          old2='''        canonical_state["coverage_percent"] = round((matched_total / len(registry_rows)) * 100.0, 2) if registry_rows else 0.0'''
          new2='''        canonical_state["coverage_percent"] = coverage_percent\n        canonical_state["canonical_min_coverage_percent"] = canonical_min_coverage\n        if not canonical_ready:\n            canonical_state["limitation"] = "Completed archive did not meet measured registry coverage required for canonical market history."'''
          if old2 not in s: raise SystemExit('coverage marker missing')
          s=s.replace(old2,new2,1)
          p.write_text(s)
          PY
      - name: Compile
        run: python -m py_compile backend/app/services/stooq_durable_import.py
      - name: Commit
        run: |
          git config user.name "daily-report-bot"
          git config user.email "actions@users.noreply.github.com"
          git add backend/app/services/stooq_durable_import.py
          git commit -m "Require measured coverage for canonical Stooq state"
          git push origin HEAD:ui-cache-validation-20260909
