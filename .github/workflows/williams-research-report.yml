name: Williams Research Report

on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/williams_research_suite.py'
      - '.github/workflows/williams-research-report.yml'

permissions:
  contents: read

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install market data client
        run: python -m pip install --disable-pip-version-check yfinance
      - name: Run dual-timeframe report
        run: |
          python scripts/williams_research_suite.py \
            --large NVDA,MSFT,GOOGL,AMZN,META \
            --mid CELH,CROX,ELF,ACLS,CAVA \
            --start 2017-01-01 \
            --signal-end 2026-09-04 \
            --valuation-end 2026-09-08 \
            --output williams_research_report.json
      - name: Upload report
        uses: actions/upload-artifact@v4
        with:
          name: williams-research-report
          path: williams_research_report.json
          retention-days: 30
