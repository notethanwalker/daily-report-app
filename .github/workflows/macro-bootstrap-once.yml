name: Macro Bootstrap Once
on:
  push:
    branches: [macro-batch-bootstrap-20260909]
    paths: ['.github/workflows/macro-bootstrap-once.yml']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add batch macro bootstrap
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('backend/app/services/refresh_scheduler.py')
          s=p.read_text()
          anchor='''def run_cycle():\n    global _last_cleanup\n    db = SessionLocal()\n    try:\n        seed_historical_from_normalized(db, set(_user_symbols(db)) | set(SECTORS) | DEPLOYMENT_WARM_SYMBOLS)\n        enqueue_stale(db); process_queue(db, 4)\n'''
          new_func='''def bootstrap_macro_cache(db, limit=80):\n    \"\"\"Batch-warm the macro universe from Yahoo OHLCV instead of serial queue jobs.\n\n    This is cache-first infrastructure: only symbols lacking the minimum technical\n    history are requested, and successful results are materialized into the same\n    normalized/snapshot/history layers used everywhere else.\n    \"\"\"\n    min_bars=int(os.getenv("MARKET_MIN_TECHNICAL_BARS","120"))\n    symbols=sorted(set(SECTORS))\n    covered={r[0] for r in db.query(NormalizedDailyBar.symbol).filter(NormalizedDailyBar.symbol.in_(symbols)).group_by(NormalizedDailyBar.symbol).having(func.count(NormalizedDailyBar.id)>=min_bars).all()}\n    missing=[s for s in symbols if s not in covered][:max(1,int(limit))]\n    if not missing:return {"status":"complete","requested":0,"covered":len(covered),"total":len(symbols)}\n    provider=YahooOhlcvProvider();succeeded=[];failed=[];snapshots=0\n    try:batch=provider.batch_daily_history(missing,period="2y")\n    except Exception as exc:return {"status":"failed","requested":len(missing),"error":str(exc)[:180]}\n    for symbol in missing:\n        data=batch.get(symbol)\n        if not data or len(data.get("rows") or [])<min_bars:\n            failed.append(symbol);continue\n        try:\n            persist_normalized_history(db,data)\n            snap=_snapshot_from_normalized(db,symbol)\n            if snap:store_market_snapshot(db,symbol,snap,"Yahoo Finance");snapshots+=1\n            succeeded.append(symbol)\n        except Exception:\n            db.rollback();failed.append(symbol)\n    if succeeded:\n        seed_historical_from_normalized(db,succeeded)\n        db.query(RefreshQueueItem).filter(RefreshQueueItem.symbol.in_(succeeded),RefreshQueueItem.data_class.in_(["market","history"]),RefreshQueueItem.status=="queued").update({RefreshQueueItem.status:"complete",RefreshQueueItem.error:"satisfied_by_macro_batch_bootstrap",RefreshQueueItem.updated_at:datetime.now(timezone.utc)},synchronize_session=False)\n        db.commit()\n    return {"status":"running" if failed else "complete","requested":len(missing),"succeeded":len(succeeded),"failed":len(failed),"snapshots":snapshots,"failed_symbols":failed[:20]}\n\n\n'''
          replacement=new_func+'''def run_cycle():\n    global _last_cleanup\n    db = SessionLocal()\n    try:\n        try:\n            bootstrap_macro_cache(db)\n        except Exception:\n            db.rollback()\n        seed_historical_from_normalized(db, set(_user_symbols(db)) | set(SECTORS) | DEPLOYMENT_WARM_SYMBOLS)\n        enqueue_stale(db); process_queue(db, 4)\n'''
          assert anchor in s
          s=s.replace(anchor,replacement)
          p.write_text(s)
          PY
      - name: Add regression contract
        run: |
          cat > backend/tests/test_macro_bootstrap_contract.py <<'PY'
          from pathlib import Path
          import unittest
          ROOT=Path(__file__).resolve().parents[2]
          S=(ROOT/'backend/app/services/refresh_scheduler.py').read_text()
          class MacroBootstrapContract(unittest.TestCase):
              def test_macro_uses_batch_warm_path(self):
                  self.assertIn('def bootstrap_macro_cache',S)
                  self.assertIn('provider.batch_daily_history(missing,period="2y")',S)
                  self.assertIn('bootstrap_macro_cache(db)',S)
                  self.assertIn('satisfied_by_macro_batch_bootstrap',S)
              def test_bootstrap_is_bounded_and_cache_first(self):
                  self.assertIn('MARKET_MIN_TECHNICAL_BARS',S)
                  self.assertIn('missing=[s for s in symbols if s not in covered]',S)
          if __name__=='__main__':unittest.main()
          PY
      - name: Validate
        run: |
          pip install -r backend/requirements.txt >/dev/null
          cd backend
          PYTHONDONTWRITEBYTECODE=1 python -m compileall -q app
          PYTHONDONTWRITEBYTECODE=1 python -m unittest discover -s tests -p 'test_*.py'
      - name: Commit only intended files
        run: |
          git config user.name "daily-report-bot"
          git config user.email "actions@users.noreply.github.com"
          git add backend/app/services/refresh_scheduler.py backend/tests/test_macro_bootstrap_contract.py
          git commit -m "Batch-warm Macro cache for immediate rotation coverage"
          git push origin HEAD:macro-batch-bootstrap-20260909
