name: Deep UI Pass Once
on:
  push:
    branches: [ui-cache-validation-20260909]
    paths: [".github/workflows/deep-ui-pass-once.yml"]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {ref: ui-cache-validation-20260909}
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - name: Patch deep mobile navigation and Large Flow sorting
        run: |
          python - <<'PY'
          from pathlib import Path
          css=Path('web/app/v4/v4.css')
          s=css.read_text()
          extra='''\n/* V4 deep-workspace interaction hardening. */\n.deep-v4-shell .table-sort-btn{appearance:none;border:0;background:transparent;color:inherit;padding:0;cursor:pointer;font:inherit;font-weight:inherit;text-align:inherit;white-space:nowrap}.deep-v4-shell .table-sort-btn.active{color:#dfe8f2}.deep-v4-shell .table-sort-btn:focus-visible{outline:2px solid #8294aa;outline-offset:3px;border-radius:3px}\n@media(max-width:430px){.deep-v4-shell .subtab-bar{display:grid!important;grid-template-columns:1fr!important;overflow:visible!important}.deep-v4-shell .subtab-bar button{width:100%!important;min-width:0!important;white-space:normal!important;text-align:left!important}}\n'''
          if 'V4 deep-workspace interaction hardening' not in s:
              css.write_text(s+extra)

          p=Path('web/app/large-flow-workspace-v3.tsx');s=p.read_text()
          old='''[status,setStatus]=useState<"active"|"expired"|"all">("active"),[windowHours,setWindowHours]=useState(72);'''
          new='''[status,setStatus]=useState<"active"|"expired"|"all">("active"),[windowHours,setWindowHours]=useState(72),[sortKey,setSortKey]=useState("premium"),[sortDir,setSortDir]=useState<"desc"|"asc">("desc");'''
          if old not in s: raise SystemExit('flow state marker missing')
          s=s.replace(old,new,1)
          old=''' const events=useMemo(()=>dedupe(feed?.events||[]).filter((e:any)=>!filter||e.symbol===filter.trim().toUpperCase()).filter((e:any)=>status==="all"||status==="expired"?status==="all"||expired(e):!expired(e)).filter((e:any)=>windowHours===0||recent(e,windowHours)),[feed,filter,status,windowHours]);const relative=[...(analytics?.rows||[])].sort((a:any,b:any)=>(b.flow_to_market_cap||0)-(a.flow_to_market_cap||0));'''
          new=''' const events=useMemo(()=>dedupe(feed?.events||[]).filter((e:any)=>!filter||e.symbol===filter.trim().toUpperCase()).filter((e:any)=>status==="all"||status==="expired"?status==="all"||expired(e):!expired(e)).filter((e:any)=>windowHours===0||recent(e,windowHours)),[feed,filter,status,windowHours]);
 const sortedEvents=useMemo(()=>{const rows=[...events];const value=(e:any)=>{const d=e.data||{};if(sortKey==="ticker")return String(e.symbol||"");if(sortKey==="premium")return Number(d.premium??-Infinity);if(sortKey==="strike")return Number(d.strike??-Infinity);if(sortKey==="expiration")return Date.parse(String(d.expiration||""))||0;if(sortKey==="flowcap")return d.premium&&d.market_cap?Number(d.premium)/Number(d.market_cap):-Infinity;if(sortKey==="contracts")return Number(d.contracts??-Infinity);if(sortKey==="voloi")return Number(d.volume_oi_ratio??-Infinity);return Date.parse(e.occurred_at||"")||0};rows.sort((a:any,b:any)=>{const av=value(a),bv=value(b),cmp=typeof av==="string"?av.localeCompare(String(bv)):Number(av)-Number(bv);return sortDir==="asc"?cmp:-cmp});return rows},[events,sortKey,sortDir]);
 function toggleSort(key:string){if(sortKey===key){setSortDir(x=>x==="asc"?"desc":"asc");return}setSortKey(key);setSortDir(key==="ticker"?"asc":"desc")}
 const sortLabel=(key:string,label:string)=><button type="button" className={`table-sort-btn ${sortKey===key?"active":""}`} aria-pressed={sortKey===key} onClick={()=>toggleSort(key)}>{label}{sortKey===key?` ${sortDir==="asc"?"↑":"↓"}`:""}</button>;
 const relative=[...(analytics?.rows||[])].sort((a:any,b:any)=>(b.flow_to_market_cap||0)-(a.flow_to_market_cap||0));'''
          if old not in s: raise SystemExit('flow events marker missing')
          s=s.replace(old,new,1)
          s=s.replace('{events.length} visible unique contracts','{sortedEvents.length} visible unique contracts',1)
          old='<thead><tr><th>Ticker</th><th>Flow</th><th>Premium</th><th>Strike</th><th>Expiration</th><th>Flow / cap</th><th>Contracts</th><th>Vol/OI</th><th>Observed</th><th>Age</th><th>Source</th></tr></thead><tbody>{events.map((e:any)=>'
          new='<thead><tr><th>{sortLabel("ticker","Ticker")}</th><th>Flow</th><th>{sortLabel("premium","Premium")}</th><th>{sortLabel("strike","Strike")}</th><th>{sortLabel("expiration","Expiration")}</th><th>{sortLabel("flowcap","Flow / cap")}</th><th>{sortLabel("contracts","Contracts")}</th><th>{sortLabel("voloi","Vol/OI")}</th><th>{sortLabel("observed","Observed")}</th><th>Age</th><th>Source</th></tr></thead><tbody>{sortedEvents.map((e:any)=>'
          if old not in s: raise SystemExit('flow header marker missing')
          s=s.replace(old,new,1)
          s=s.replace('{!events.length&&<div className="card inline-state">','{!sortedEvents.length&&<div className="card inline-state">',1)
          p.write_text(s)
          PY
      - name: Commit
        run: |
          git config user.name "daily-report-bot"
          git config user.email "actions@users.noreply.github.com"
          git add web/app/v4/v4.css web/app/large-flow-workspace-v3.tsx
          git commit -m "Harden deep mobile tabs and sort Large Flow metrics"
          git push origin HEAD:ui-cache-validation-20260909
