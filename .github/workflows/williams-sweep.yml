name: Williams Strategy Sweep

on:
  workflow_dispatch:
    inputs:
      symbols:
        description: Comma-separated ticker symbols
        required: true
        default: NVDA,MU,AMD,AVGO,TSM,ASML,AMAT,LRCX,KLAC,QCOM,AMZN,META,GOOGL,MSFT,TSLA,NFLX,SPY,QQQ,SMH,IWM,XLK
      start:
        description: Start date YYYY-MM-DD
        required: true
        default: '2017-01-01'
      end:
        description: End date YYYY-MM-DD; blank uses latest bar
        required: false
        default: ''
      thresholds:
        description: Comma-separated Williams thresholds
        required: true
        default: '-60,-70,-75,-80,-85,-90'
      windows:
        description: Comma-separated Williams lookback windows
        required: true
        default: '7,14,21,28'
  push:
    paths:
      - '.github/workflows/williams-sweep.yml'

permissions:
  contents: read

jobs:
  sweep:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install free market-data client
        run: python -m pip install --disable-pip-version-check yfinance
      - name: Run sweep
        shell: bash
        run: |
          SYMBOLS="${{ github.event.inputs.symbols || 'NVDA,MU,AMD,AVGO,TSM,ASML,AMAT,LRCX,KLAC,QCOM,AMZN,META,GOOGL,MSFT,TSLA,NFLX,SPY,QQQ,SMH,IWM,XLK' }}"
          START="${{ github.event.inputs.start || '2017-01-01' }}"
          END="${{ github.event.inputs.end }}"
          THRESHOLDS="${{ github.event.inputs.thresholds || '-60,-70,-75,-80,-85,-90' }}"
          WINDOWS="${{ github.event.inputs.windows || '7,14,21,28' }}"
          ARGS=(--symbols "$SYMBOLS" --start "$START" --thresholds "$THRESHOLDS" --windows "$WINDOWS" --output williams_sweep.csv)
          if [ -n "$END" ]; then ARGS+=(--end "$END"); fi
          python scripts/williams_sweep.py "${ARGS[@]}"
      - name: Upload sweep results
        uses: actions/upload-artifact@v4
        with:
          name: williams-sweep-results
          path: williams_sweep.csv
          retention-days: 30
