name: V4 Integration Once
on:
  push:
    branches: [design-philosophy-hardening-20260909]
    paths:
      - ".github/workflows/v4-integration-once.yml"
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: design-philosophy-hardening-20260909
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Wire deployment score and V4 detail controls
        run: |
          python - <<'PY'
          from pathlib import Path

          p=Path('backend/app/routers/stack_v4.py')
          s=p.read_text()
          s=s.replace('from ..services.feature_model_v4 import presentation_payload\n', 'from ..services.feature_model_v4 import presentation_payload\nfrom ..services.fundamental_score import build_fundamental_score\n')
          old='''    return {"model":"Williams Priority v1","basket":name,"symbols":selected,"capital":capital,"new_capital_only":True,"existing_holdings_rebalanced":False,"quality_gate":"manual",**deployment_plan(selected,capital)}'''
          new='''    plan=deployment_plan(selected,capital)\n    for row in plan.get("eligible",[]):\n        fund=db.get(FundamentalCache,row["symbol"])\n        row["fundamental_score"]=build_fundamental_score(fund.payload if fund else None)\n        row["fundamental_source"]={"provider":fund.provider,"retrieved_at":fund.retrieved_at.isoformat()} if fund else None\n    return {"model":"Williams Priority v1 + informational fundamentals","basket":name,"symbols":selected,"capital":capital,"new_capital_only":True,"existing_holdings_rebalanced":False,"quality_gate":"informational_only","fundamental_score_policy":"Display-only context. Fundamental score never changes Williams rank, weight, eligibility or suggested dollars.",**plan}'''
          if old not in s: raise SystemExit('stack deployment marker missing')
          s=s.replace(old,new,1)
          p.write_text(s)

          p=Path('web/app/v4/page.tsx');s=p.read_text()
          s=s.replace('import {AuthGate,type Account} from "../auth-shell";\n', 'import {AuthGate,type Account} from "../auth-shell";\nimport DeepLinksV4 from "./deep-links-v4";\nimport OpportunityTableV4 from "./opportunity-table-v4";\n')
          old='''<article className="v4-card wide"><h2>Highest-ranked market candidates</h2><div className="v4-table opportunities funnel-table">{(funnel?.candidates||[]).slice(0,30).map((x:any)=><button className="table-row-button" key={x.symbol} onClick={()=>openResearch(x.symbol)} title={`Open ${x.symbol} research`}><strong>{x.symbol}</strong><span>{x.rotation_proxy||x.sector||"Unclassified"}</span><span>{words(x.setup_type||x.bucket||x.rotation_state||"tracked")}</span><span>100MA {x.price_vs_ma100_percent==null&&x.ma100_distance==null?"—":`${n(x.price_vs_ma100_percent??x.ma100_distance,1)}%`}</span><span>W%R {n(x.williams_r_14??x.williams_feature,1)}</span><span>{words(x.verification_status||x.enrichment_status||x.rotation_state||"unknown")}</span><b>{n(x.funnel_score??x.score,1)}</b></button>)}</div><p className="muted">{funnel?.methodology||layer?.methodology}</p></article>'''
          new='''<article className="v4-card wide"><h2>Highest-ranked market candidates</h2><OpportunityTableV4 rows={(funnel?.candidates||[]).slice(0,60)} onOpen={openResearch}/><p className="muted">{funnel?.methodology||layer?.methodology}</p></article>'''
          if old not in s: raise SystemExit('opportunity table marker missing')
          s=s.replace(old,new,1)
          old='''<div className="allocation-list">{deployment.eligible.map((x:any)=><button className="allocation-row-button" key={x.symbol} onClick={()=>openResearch(x.symbol)}><div><strong>{x.priority_rank}. {x.symbol}</strong><small>14M W%R {n(x.williams_r,1)} · {x.signal_month}</small></div><span>{(Number(x.priority_weight)*100).toFixed(1)}%</span><b>${Number(x.suggested_dollars).toLocaleString()}</b></button>)}</div>'''
          new='''<div className="allocation-list">{deployment.eligible.map((x:any)=><button className="allocation-row-button" key={x.symbol} onClick={()=>openResearch(x.symbol)}><div><strong>{x.priority_rank}. {x.symbol}</strong><small>14M W%R {n(x.williams_r,1)} · {x.signal_month}</small><small>Fundamental {x.fundamental_score?.score==null?"—":n(x.fundamental_score.score,1)} · {x.fundamental_score?.grade||"insufficient data"} · {Math.round(Number(x.fundamental_score?.coverage||0)*100)}% coverage</small></div><span>{(Number(x.priority_weight)*100).toFixed(1)}%</span><b>${Number(x.suggested_dollars).toLocaleString()}</b></button>)}</div><details className="deployment-fundamentals"><summary>Fundamental score details</summary>{deployment.eligible.map((x:any)=><div className="fundamental-detail" key={`fund-${x.symbol}`}><strong>{x.symbol} · {x.fundamental_score?.score==null?"—":n(x.fundamental_score.score,1)}</strong><span>{x.fundamental_score?.grade||"insufficient data"} · {Math.round(Number(x.fundamental_score?.coverage||0)*100)}% evidence coverage</span><small>{(x.fundamental_score?.components||[]).map((c:any)=>`${words(c.factor)} ${n(c.score,0)}`).join(" · ")||"No cached fundamental evidence yet."}</small><small>{x.fundamental_source?`${x.fundamental_source.provider} · ${when(x.fundamental_source.retrieved_at)}`:"Source pending cache population"}</small></div>)}</details><p className="muted">{deployment.fundamental_score_policy}</p>'''
          if old not in s: raise SystemExit('deployment row marker missing')
          s=s.replace(old,new,1)
          footer='''  <footer className="v4-footer">Legacy Daily Report remains available at /legacy while V4 is validated.</footer>'''
          if footer in s:
              s=s.replace(footer,'''  <DeepLinksV4 layer={active}/><footer className="v4-footer">Legacy Daily Report remains available at /legacy while V4 is validated.</footer>''',1)
          else:
              marker=''' </main>\n}'''
              if marker not in s: raise SystemExit('page footer marker missing')
              s=s.replace(marker,'''  <DeepLinksV4 layer={active}/>\n </main>\n}''',1)
          p.write_text(s)

          p=Path('backend/app/main.py');s=p.read_text()
          s=s.replace('def _load_world_news(topic,limit):\n q=WORLD_NEWS_TOPIC_QUERIES.get(topic,WORLD_NEWS_ALL_QUERY);d=GdeltProvider().search(q,max_records=limit,timespan="48h")', 'def _load_world_news(topic,limit,hours=48):\n q=WORLD_NEWS_TOPIC_QUERIES.get(topic,WORLD_NEWS_ALL_QUERY);hours=max(1,min(int(hours),168));d=GdeltProvider().search(q,max_records=limit,timespan=f"{hours}h")')
          old='''def world_news(limit:int=Query(default=25,ge=1,le=50),topic:str|None=None):\n selected=topic if topic in WORLD_NEWS_TOPIC_QUERIES else None\n try:return _cached_shared(f"world:{limit}:{selected or 'all'}",NEWS_CACHE_TTL_SECONDS,lambda:_load_world_news(selected,limit))'''
          new='''def world_news(limit:int=Query(default=25,ge=1,le=50),topic:str|None=None,hours:int=Query(default=48,ge=1,le=168)):\n selected=topic if topic in WORLD_NEWS_TOPIC_QUERIES else None\n try:return _cached_shared(f"world:{limit}:{selected or 'all'}:{hours}h",NEWS_CACHE_TTL_SECONDS,lambda:_load_world_news(selected,limit,hours))'''
          if old not in s: raise SystemExit('world news endpoint marker missing')
          s=s.replace(old,new,1);p.write_text(s)

          p=Path('web/app/v4/v4.css');s=p.read_text()
          s += '\n.table-controls{display:flex;gap:10px;align-items:end;flex-wrap:wrap;margin:0 0 14px}.table-controls label{display:grid;gap:5px;color:#8f9bab;font-size:12px}.table-controls select,.table-controls button{background:#121923;border:1px solid #2b3543;color:#e8edf4;border-radius:9px;padding:8px 10px}.table-controls>span{margin-left:auto;color:#7f8b99}.deep-links{margin-top:14px}.deep-links summary,.deployment-fundamentals summary{cursor:pointer;display:flex;justify-content:space-between;gap:12px;align-items:center}.deep-link-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-top:14px}.deep-link-grid a{display:grid;gap:5px;padding:12px;border:1px solid #26303b;border-radius:10px;color:#dce4ee;text-decoration:none;background:#0b1016}.deep-link-grid small,.deep-link-grid span,.fundamental-detail span,.fundamental-detail small{color:#84909f}.deployment-fundamentals{margin-top:14px;border-top:1px solid #202730;padding-top:12px}.fundamental-detail{display:grid;gap:4px;padding:10px 0;border-bottom:1px solid #1b222b}.fundamental-detail:last-child{border-bottom:0}@media(max-width:800px){.deep-link-grid{grid-template-columns:1fr 1fr}.table-controls>span{margin-left:0}}@media(max-width:560px){.deep-link-grid{grid-template-columns:1fr}.table-controls{align-items:stretch}.table-controls label,.table-controls select,.table-controls button{width:100%}}\n'
          p.write_text(s)

          p=Path('backend/tests/test_design_philosophy_contract.py');s=p.read_text()
          s=s.replace('PHILOSOPHY = (ROOT / "docs/DAILY_REPORT_APP_DESIGN_PHILOSOPHY.md").read_text(encoding="utf-8")', 'PHILOSOPHY = (ROOT / "docs/DAILY_REPORT_APP_DESIGN_PHILOSOPHY.md").read_text(encoding="utf-8")\nSTACK = (ROOT / "backend/app/routers/stack_v4.py").read_text(encoding="utf-8")\nMAIN = (ROOT / "backend/app/main.py").read_text(encoding="utf-8")')
          marker='''    def test_mobile_progressive_disclosure_is_preserved(self):'''
          tests='''    def test_deployment_fundamental_score_is_informational_only(self):\n        self.assertIn('build_fundamental_score', STACK)\n        self.assertIn('fundamental_score_policy', STACK)\n        self.assertIn('never changes Williams rank, weight, eligibility or suggested dollars', STACK)\n        self.assertNotIn('fundamental_score', (ROOT / "backend/app/services/monthly_priority.py").read_text(encoding="utf-8"))\n\n    def test_expandable_detail_controls_are_wired_into_v4(self):\n        self.assertIn('DeepLinksV4', V4)\n        self.assertIn('OpportunityTableV4', V4)\n        self.assertIn('Fundamental score details', V4)\n\n    def test_world_news_window_is_real_backend_input(self):\n        self.assertIn('hours:int=Query(default=48,ge=1,le=168)', MAIN)\n        self.assertIn('timespan=f"{hours}h"', MAIN)\n\n'''
          if marker not in s: raise SystemExit('test marker missing')
          s=s.replace(marker,tests+marker,1);p.write_text(s)
          PY
      - name: Compile backend changes
        run: python -m py_compile backend/app/routers/stack_v4.py backend/app/main.py backend/app/services/fundamental_score.py backend/tests/test_fundamental_score.py backend/tests/test_design_philosophy_contract.py
      - name: Commit integration
        run: |
          git config user.name "daily-report-bot"
          git config user.email "actions@users.noreply.github.com"
          git add backend/app/routers/stack_v4.py backend/app/main.py backend/tests/test_design_philosophy_contract.py web/app/v4/page.tsx web/app/v4/v4.css
          git commit -m "Wire V4 deep controls and informational fundamental score"
          git push origin HEAD:design-philosophy-hardening-20260909
