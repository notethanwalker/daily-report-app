name: Fundamentals Smoke Temp
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fundamentals-smoke-temp.yml'
jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Verify live valuation population
        run: |
          python - <<'PY'
          import json, urllib.request, urllib.error
          base='https://daily-report-api-ero2.onrender.com/api/v1/markets'
          symbols=['MU','WEN','AAPL']
          complete=[]
          for s in symbols:
              try:
                  with urllib.request.urlopen(f'{base}/{s}/fundamentals', timeout=60) as r:
                      d=json.load(r)
              except urllib.error.HTTPError as e:
                  print(s,'HTTP',e.code,e.read().decode()[:300]); continue
              vals={k:d.get(k) for k in ['pe_ratio','price_to_sales_ratio','peg_ratio']}
              print(s,d.get('provider'),vals,d.get('valuation_source'))
              if all(v is not None for v in vals.values()): complete.append(s)
          if not complete:
              raise SystemExit('No tested ticker populated P/E, P/S, and PEG together')
          print('PASS complete valuation fields:', ','.join(complete))
          PY
