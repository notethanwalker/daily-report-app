name: Fundamentals Smoke Temp
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fundamentals-smoke-temp.yml'
jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Install yfinance
        run: pip install -q yfinance
      - name: Inspect Yahoo fields
        run: |
          python - <<'PY'
          import yfinance as yf
          for s in ['AAPL','MU','WEN']:
              t=yf.Ticker(s)
              print('\n',s)
              try:
                  f=dict(t.fast_info)
                  print('fast', {k:f.get(k) for k in ['last_price','market_cap','shares','year_high','year_low']})
              except Exception as e: print('fast error',repr(e))
              try:
                  q=t.quarterly_income_stmt
                  print('quarterly rows',list(q.index)[:30])
                  for row in ['Total Revenue','Diluted EPS','Basic EPS','Net Income','Diluted Average Shares']:
                      if row in q.index: print(row,list(q.loc[row].dropna().head(5).items()))
              except Exception as e: print('quarterly error',repr(e))
          PY
