name: Final Live Release Candidate
on:
  push:
    branches: [release-candidate-20260909]
    paths: ['.github/workflows/release-candidate-final-live.yml']
permissions:
  contents: read
jobs:
  live-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Create temporary production test account
        run: |
          set -euo pipefail
          EMAIL="rc-final-${GITHUB_RUN_ID}@example.invalid"
          PASS="$(openssl rand -hex 18)"
          printf '%s' "$EMAIL" >/tmp/rc-email
          printf '%s' "$PASS" >/tmp/rc-pass
          curl --fail --silent --show-error -H 'Content-Type: application/json' \
            -d "{\"email\":\"$EMAIL\",\"password\":\"$PASS\"}" \
            https://daily-report-api-ero2.onrender.com/api/v1/auth/register >/dev/null
      - name: Wait for approval
        run: |
          set -euo pipefail
          EMAIL="$(cat /tmp/rc-email)"; PASS="$(cat /tmp/rc-pass)"
          for i in {1..60}; do
            CODE=$(curl --silent --output /dev/null --write-out '%{http_code}' \
              -H 'Content-Type: application/json' \
              -d "{\"email\":\"$EMAIL\",\"password\":\"$PASS\"}" \
              https://daily-report-api-ero2.onrender.com/api/v1/auth/login || true)
            [ "$CODE" = "200" ] && exit 0
            sleep 5
          done
          exit 1
      - name: Build exact frontend
        working-directory: web
        run: |
          npm install
          npm install --no-save playwright
          npm run build
          npx playwright install chromium
      - name: Start release candidate
        working-directory: web
        env:
          BACKEND_INTERNAL_URL: https://daily-report-api-ero2.onrender.com
        run: |
          nohup npm start -- -p 3000 >/tmp/rc-next.log 2>&1 &
          for i in {1..60}; do curl -fsS http://127.0.0.1:3000 >/dev/null && exit 0; sleep 1; done
          cat /tmp/rc-next.log; exit 1
      - name: Live desktop and mobile integration
        working-directory: web
        run: |
          cat > live-final.mjs <<'JS'
          import fs from 'node:fs';
          import { chromium } from 'playwright';
          const email=fs.readFileSync('/tmp/rc-email','utf8');
          const password=fs.readFileSync('/tmp/rc-pass','utf8');
          const browser=await chromium.launch({headless:true});
          const failures=[];
          for(const [width,height] of [[1440,1000],[390,844]]){
            const ctx=await browser.newContext({viewport:{width,height}});
            const page=await ctx.newPage();
            const pageErrors=[]; const consoleErrors=[];
            page.on('pageerror',e=>pageErrors.push(String(e)));
            page.on('console',m=>{if(m.type()==='error')consoleErrors.push(m.text())});
            await page.goto('http://127.0.0.1:3000/v4',{waitUntil:'domcontentloaded',timeout:30000});
            await page.getByLabel('Email').fill(email);
            await page.getByLabel('Password').fill(password);
            await page.locator('button.auth-primary').click();
            const nameInput=page.getByLabel('Name');
            const stack=page.getByRole('heading',{name:'Decision Stack'});
            await Promise.race([nameInput.waitFor({state:'visible',timeout:20000}).catch(()=>null),stack.waitFor({state:'visible',timeout:20000}).catch(()=>null)]);
            if(await nameInput.isVisible().catch(()=>false)){
              await nameInput.fill('Release Test');
              await page.getByRole('button',{name:'Continue'}).click();
            }
            await stack.waitFor({timeout:20000});
            const overflow=async label=>{const n=await page.evaluate(()=>document.documentElement.scrollWidth-document.documentElement.clientWidth);if(n>2)failures.push(`${width}:${label}:overflow:${n}`)};
            await overflow('research');
            await page.getByRole('button',{name:/Macro/}).click();
            await page.waitForFunction(()=>/[1-9]\d* groups\b/.test(document.querySelector('main')?.innerText||''),null,{timeout:25000});
            await overflow('macro');
            await page.getByRole('button',{name:/Opportunity/}).click();
            await page.waitForFunction(()=>/[1-9]\d* shown\b/.test(document.querySelector('main')?.innerText||''),null,{timeout:25000});
            await overflow('opportunity');
            await page.getByRole('button',{name:/Deployment/}).click();
            await page.waitForTimeout(2500);
            const body=await page.locator('main').innerText();
            if(/This view took too long|HTTP 5\d\d|map is not a function/i.test(body))failures.push(`${width}:deployment:error`);
            await overflow('deployment');
            if(pageErrors.length)failures.push(`${width}:page:${pageErrors.join('|')}`);
            if(consoleErrors.filter(x=>!/favicon/i.test(x)).length)failures.push(`${width}:console:${consoleErrors.join('|')}`);
            await ctx.close();
          }
          await browser.close();
          if(failures.length){console.error(failures.join('\n'));process.exit(1)}
          console.log('FINAL_LIVE_RC_OK');
          JS
          node live-final.mjs
