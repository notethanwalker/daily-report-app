name: Vercel Release Package Once
on:
  push:
    branches:
      - vercel-release-20260910-status-slow-fix
permissions:
  contents: write
jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Package exact web source
        run: |
          tar -czf vercel-web-source.tgz web
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add vercel-web-source.tgz
          git commit -m "Add Vercel web source archive" || exit 0
          git push
