name: Fix V4 Shape Guards Once
on:
  push:
    branches: [fix-v4-shape-guards-20260909]
    paths: ['.github/workflows/fix-v4-shape-guards-once.yml']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply defensive shape guards
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('web/app/v4/page.tsx')
          s=p.read_text()
          s=s.replace('const when=(v:any)=>{if(!v)return "—";const d=new Date(v);return Number.isNaN(d.getTime())?String(v):d.toLocaleString()};', 'const when=(v:any)=>{if(!v)return "—";const d=new Date(v);return Number.isNaN(d.getTime())?String(v):d.toLocaleString()};\nconst arr=(v:any):any[]=>Array.isArray(v)?v:[];\nconst normalizeRotation=(x:any)=>({...((x&&typeof x==="object")?x:{}),rows:arr(x?.rows),early_rotation:arr(x?.early_rotation),outflow_risk:arr(x?.outflow_risk)});\nconst normalizeFunnel=(x:any)=>({...((x&&typeof x==="object")?x:{}),candidates:arr(x?.candidates??x?.rows),rows:arr(x?.rows??x?.candidates),stages:arr(x?.stages)});\nconst normalizeDeployment=(x:any)=>({...((x&&typeof x==="object")?x:{}),eligible:arr(x?.eligible),unavailable:arr(x?.unavailable)});')
          s=s.replace('setDeployment(await requestJson(`${API}/api/v1/stack/deployment?basket=${encodeURIComponent(basket)}&capital=${capital}`))','setDeployment(normalizeDeployment(await requestJson(`${API}/api/v1/stack/deployment?basket=${encodeURIComponent(basket)}&capital=${capital}`)))')
          s=s.replace('setRotation(await requestJson(`${API}/api/v1/stack/rotation`))','setRotation(normalizeRotation(await requestJson(`${API}/api/v1/stack/rotation`)))')
          s=s.replace('setFunnel(await requestJson(`${API}/api/v1/stack/candidates?limit=60`))','setFunnel(normalizeFunnel(await requestJson(`${API}/api/v1/stack/candidates?limit=60`)))')
          s=s.replace('(rotation?.early_rotation||[]).map(', 'arr(rotation?.early_rotation).map(')
          s=s.replace('(rotation?.outflow_risk||[]).map(', 'arr(rotation?.outflow_risk).map(')
          s=s.replace('(deployment?.eligible||[]).map(', 'arr(deployment?.eligible).map(')
          s=s.replace('(deployment?.unavailable||[]).map(', 'arr(deployment?.unavailable).map(')
          s=s.replace('(funnel?.candidates||funnel?.rows||[]).', 'arr(funnel?.candidates??funnel?.rows).')
          p.write_text(s)

          p=Path('web/app/v4/macro-rotation-table-v4.tsx')
          s=p.read_text()
          s=s.replace('const source=[...(rotation?.rows||[])];','const source=Array.isArray(rotation?.rows)?[...rotation.rows]:[];')
          p.write_text(s)

          p=Path('web/app/v4/opportunity-table-v4.tsx')
          s=p.read_text()
          s=s.replace('const buckets=useMemo(()=>Array.from(new Set((rows||[]).map((x:any)=>String(x.bucket||"")).filter(Boolean))).sort(),[rows]);','const safeRows=Array.isArray(rows)?rows:[];\n const buckets=useMemo(()=>Array.from(new Set(safeRows.map((x:any)=>String(x.bucket||"")).filter(Boolean))).sort(),[safeRows]);')
          s=s.replace('const out=(rows||[]).filter(x=>bucket==="all"||x.bucket===bucket);','const out=safeRows.filter(x=>bucket==="all"||x.bucket===bucket);')
          s=s.replace('},[rows,sort,direction,bucket]);','},[safeRows,sort,direction,bucket]);')
          p.write_text(s)
          PY
      - name: Validate production build
        working-directory: web
        run: |
          npm install
          npm run build
      - name: Commit patch
        run: |
          git config user.name "daily-report-bot"
          git config user.email "actions@users.noreply.github.com"
          git add web/app/v4/page.tsx web/app/v4/macro-rotation-table-v4.tsx web/app/v4/opportunity-table-v4.tsx
          git commit -m "Harden V4 against malformed collection payloads"
          git push origin HEAD:fix-v4-shape-guards-20260909
