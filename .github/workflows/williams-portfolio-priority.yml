name: Williams Portfolio Priority

on:
  push:
    paths:
      - 'scripts/williams_portfolio_priority.py'
      - '.github/workflows/williams-portfolio-priority.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install market data client
        run: python -m pip install --disable-pip-version-check yfinance
      - name: Run full-period test
        run: |
          python scripts/williams_portfolio_priority.py \
            --symbols NVDA,MSFT,GOOGL,AMZN,META,CELH,CROX,ELF,ACLS,OLED \
            --start 2017-01-01 \
            --end 2026-09-04 \
            --monthly-cash 10000 \
            --tilts 0.25,0.5,0.75,1.0 \
            --output williams_portfolio_priority.json
      - name: Run early-period validation
        run: |
          python scripts/williams_portfolio_priority.py \
            --symbols NVDA,MSFT,GOOGL,AMZN,META,CELH,CROX,ELF,ACLS,OLED \
            --start 2017-01-01 \
            --end 2021-12-31 \
            --monthly-cash 10000 \
            --tilts 0.25,0.5,0.75,1.0 \
            --output williams_portfolio_priority_2017_2021.json
      - name: Run late-period validation
        run: |
          python scripts/williams_portfolio_priority.py \
            --symbols NVDA,MSFT,GOOGL,AMZN,META,CELH,CROX,ELF,ACLS,OLED \
            --start 2022-01-01 \
            --end 2026-09-04 \
            --monthly-cash 10000 \
            --tilts 0.25,0.5,0.75,1.0 \
            --output williams_portfolio_priority_2022_2026.json
      - name: Upload results
        uses: actions/upload-artifact@v4
        with:
          name: williams-portfolio-priority
          path: |
            williams_portfolio_priority.json
            williams_portfolio_priority_2017_2021.json
            williams_portfolio_priority_2022_2026.json
          retention-days: 30
