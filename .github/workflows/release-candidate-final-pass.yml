name: Final Live Release Gate
on:
  push:
    branches: [release-candidate-20260909]
    paths: ['.github/workflows/release-candidate-final-pass.yml']
permissions:
  contents: read
jobs:
  final-live:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 20}
      - name: Create temporary account
        run: |
          set -euo pipefail
          EMAIL="rc-pass-${GITHUB_RUN_ID}@example.invalid"; PASS="$(openssl rand -hex 18)"
          printf '%s' "$EMAIL" >/tmp/e; printf '%s' "$PASS" >/tmp/p
          curl -fsS -H 'Content-Type: application/json' -d "{\"email\":\"$EMAIL\",\"password\":\"$PASS\"}" https://daily-report-api-ero2.onrender.com/api/v1/auth/register >/dev/null
      - name: Wait for approval
        run: |
          set -euo pipefail
          E="$(cat /tmp/e)"; P="$(cat /tmp/p)"
          for i in {1..60}; do C=$(curl -s -o /dev/null -w '%{http_code}' -H 'Content-Type: application/json' -d "{\"email\":\"$E\",\"password\":\"$P\"}" https://daily-report-api-ero2.onrender.com/api/v1/auth/login || true); [ "$C" = 200 ] && exit 0; sleep 5; done; exit 1
      - name: Build and start exact candidate
        working-directory: web
        env: {BACKEND_INTERNAL_URL: https://daily-report-api-ero2.onrender.com}
        run: |
          npm install
          npm install --no-save playwright
          npm run build
          npx playwright install chromium
          nohup npm start -- -p 3000 >/tmp/next.log 2>&1 &
          for i in {1..60}; do curl -fsS http://127.0.0.1:3000 >/dev/null && exit 0; sleep 1; done; cat /tmp/next.log; exit 1
      - name: Real API and frontend integration
        working-directory: web
        run: |
          cat > final-pass.mjs <<'JS'
          import fs from 'node:fs'; import {chromium} from 'playwright';
          const email=fs.readFileSync('/tmp/e','utf8'), password=fs.readFileSync('/tmp/p','utf8');
          const browser=await chromium.launch({headless:true}); const failures=[];
          for(const [width,height] of [[1440,1000],[390,844]]){
            const ctx=await browser.newContext({viewport:{width,height}}), page=await ctx.newPage(); const bad=[], js=[];
            page.on('response',r=>{if(r.status()>=400)bad.push(`${r.status()} ${r.url()}`)}); page.on('pageerror',e=>js.push(String(e)));
            await page.goto('http://127.0.0.1:3000/v4',{waitUntil:'domcontentloaded',timeout:30000});
            await page.getByLabel('Email').fill(email); await page.getByLabel('Password').fill(password); await page.locator('button.auth-primary').click();
            const name=page.getByLabel('Name'), stack=page.getByRole('heading',{name:'Decision Stack'});
            await Promise.race([name.waitFor({state:'visible',timeout:20000}).catch(()=>null),stack.waitFor({state:'visible',timeout:20000}).catch(()=>null)]);
            if(await name.isVisible().catch(()=>false)){await name.fill('Release Test'); await page.getByRole('button',{name:'Continue'}).click()}
            await stack.waitFor({timeout:20000});
            const overflow=async label=>{const n=await page.evaluate(()=>document.documentElement.scrollWidth-document.documentElement.clientWidth);if(n>2)failures.push(`${width}:${label}:overflow:${n}`)};
            await overflow('research');
            await page.getByRole('button',{name:/Macro/}).click(); await page.waitForFunction(()=>/[1-9]\d* groups\b/.test(document.querySelector('main')?.innerText||''),null,{timeout:25000}); await overflow('macro');
            await page.getByRole('button',{name:/Opportunity/}).click(); await page.waitForFunction(()=>/[1-9]\d* shown\b/.test(document.querySelector('main')?.innerText||''),null,{timeout:25000}); await overflow('opportunity');
            await page.getByRole('button',{name:/Deployment/}).click(); await page.waitForTimeout(3000); const text=await page.locator('main').innerText();
            if(/This view took too long|HTTP 5\d\d|map is not a function|Backend temporarily unavailable/i.test(text))failures.push(`${width}:deployment-visible-error`); await overflow('deployment');
            const unexpected=bad.filter(x=>!(/^401 .*\/auth\/session(?:\?|$)/.test(x))); if(unexpected.length)failures.push(`${width}:http:${unexpected.join('|')}`); if(js.length)failures.push(`${width}:js:${js.join('|')}`); await ctx.close();
          }
          await browser.close(); if(failures.length){console.error(failures.join('\n'));process.exit(1)} console.log('FINAL_LIVE_RELEASE_OK');
          JS
          node final-pass.mjs
