name: Live API Smoke Test

on:
  push:
    paths:
      - .github/workflows/smoke-once.yml

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Wait for Render deploy
        run: sleep 75

      - name: Check backend health
        run: |
          set -euo pipefail
          HEALTH=$(curl --fail --silent --show-error --retry 5 --retry-delay 5 https://daily-report-api-ero2.onrender.com/api/v1/health)
          echo "$HEALTH" | jq '{status,version}'
          echo "$HEALTH" | jq -e '.status == "ok"'

      - name: Check expanded event calendar
        run: |
          set -euo pipefail
          EVENTS=$(curl --fail --silent --show-error --retry 3 --retry-delay 5 'https://daily-report-api-ero2.onrender.com/api/v1/events?days=90&sort=impact&order=desc&limit=300')
          echo "$EVENTS" | jq '{count,providers,categories,errors}'
          echo "$EVENTS" | jq -e '(.events | type == "array") and (.count >= 5) and (.providers | type == "array")'

      - name: Check valuation coverage
        run: |
          set -euo pipefail
          for SYMBOL in NVDA MU AAOI; do
            FUND=$(curl --fail --silent --show-error --retry 2 --retry-delay 5 "https://daily-report-api-ero2.onrender.com/api/v1/markets/${SYMBOL}/fundamentals")
            echo "$FUND" | jq '{symbol,pe_ratio,price_to_sales_ratio,peg_ratio,coverage,valuation_sources,field_sources,provider,fundamentals_cache}'
            echo "$FUND" | jq -e '.symbol != null and .coverage.ps == true'
          done

      - name: Check live portfolio baseline
        run: |
          set -euo pipefail
          PORTS=$(curl --fail --silent --show-error https://daily-report-api-ero2.onrender.com/api/v1/portfolios)
          PID=$(echo "$PORTS" | jq -r '.portfolios[] | select(.name=="Joint Fidelity") | .id' | head -1)
          test -n "$PID"
          DETAIL=$(curl --fail --silent --show-error "https://daily-report-api-ero2.onrender.com/api/v1/portfolios/${PID}")
          echo "$DETAIL" | jq '{portfolio,baseline,market_value,invested_value,cash_percent,holding_count:(.holdings|length),sample:(.holdings[0]|{symbol,baseline,live})}'
          echo "$DETAIL" | jq -e '.baseline.initial_total_value > 0 and (.holdings | length) == 9 and ([.holdings[] | has("baseline") and has("live")] | all)'

      - name: Check custom alert variables and Web Push readiness
        run: |
          set -euo pipefail
          ALERTS=$(curl --fail --silent --show-error https://daily-report-api-ero2.onrender.com/api/v1/alerts/v2)
          echo "$ALERTS" | jq '{push,variable_count:(.variables|length),variables:(.variables|keys)}'
          echo "$ALERTS" | jq -e '.variables.pe and .variables.sector_score and .variables.bullish_flow and .push.configured == true'
          PUSH=$(curl --fail --silent --show-error https://daily-report-api-ero2.onrender.com/api/v1/push/config)
          echo "$PUSH" | jq '{configured,subscriptions,public_key_present:(.public_key != null)}'
          echo "$PUSH" | jq -e '.configured == true and .public_key != null'
