name: Live API Smoke Test

on:
  push:
    paths:
      - .github/workflows/smoke-once.yml

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Wait for Render deploy
        run: sleep 75

      - name: Check backend health
        run: |
          set -euo pipefail
          HEALTH=$(curl --fail --silent --show-error --retry 5 --retry-delay 5 https://daily-report-api-ero2.onrender.com/api/v1/health)
          echo "$HEALTH"
          echo "$HEALTH" | jq -e '.status == "ok" and .providers.twelve_data.configured == true'

      - name: Check Twelve Data market pipeline
        run: |
          set -euo pipefail
          MARKET=$(curl --fail --silent --show-error --retry 3 --retry-delay 10 https://daily-report-api-ero2.onrender.com/api/v1/markets/SPY)
          echo "$MARKET"
          echo "$MARKET" | jq -e '.symbol == "SPY" and (.price | type == "number") and .provider == "Twelve Data"'
