name: Warm Priority Once
on:
  push:
    branches: [ui-cache-validation-20260909]
    paths: [".github/workflows/warm-priority-once.yml"]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {ref: ui-cache-validation-20260909}
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - name: Prioritize deployment warm symbols
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('backend/app/services/refresh_scheduler.py');s=p.read_text()
          old='''    for symbol in sorted(users):\n        market = db.query(MarketSnapshot).filter(MarketSnapshot.symbol == symbol).order_by(MarketSnapshot.retrieved_at.desc()).first()\n        fundamental = db.get(FundamentalCache, symbol)\n        if not market or is_stale(market.retrieved_at, "market", now):\n            _enqueue(db, symbol, "market", FRESHNESS_POLICIES["market"].priority)\n        if _history_needs_refresh(db, symbol, now):\n            _enqueue(db, symbol, "history", FRESHNESS_POLICIES["history"].priority)\n        if _fundamentals_supported(db, symbol) and (not fundamental or is_stale(fundamental.retrieved_at, "fundamentals", now)):\n            _enqueue(db, symbol, "fundamentals", FRESHNESS_POLICIES["fundamentals"].priority)'''
          new='''    for symbol in sorted(users):\n        market = db.query(MarketSnapshot).filter(MarketSnapshot.symbol == symbol).order_by(MarketSnapshot.retrieved_at.desc()).first()\n        fundamental = db.get(FundamentalCache, symbol)\n        warm_boost = 50 if symbol in DEPLOYMENT_WARM_SYMBOLS else 0\n        if not market or is_stale(market.retrieved_at, "market", now):\n            _enqueue(db, symbol, "market", FRESHNESS_POLICIES["market"].priority + warm_boost)\n        if _history_needs_refresh(db, symbol, now):\n            _enqueue(db, symbol, "history", FRESHNESS_POLICIES["history"].priority + warm_boost)\n        if _fundamentals_supported(db, symbol) and (not fundamental or is_stale(fundamental.retrieved_at, "fundamentals", now)):\n            _enqueue(db, symbol, "fundamentals", FRESHNESS_POLICIES["fundamentals"].priority + warm_boost)'''
          if old not in s: raise SystemExit('user refresh loop not found')
          s=s.replace(old,new,1);p.write_text(s)
          PY
      - name: Compile
        run: python -m py_compile backend/app/services/refresh_scheduler.py
      - name: Commit
        run: |
          git config user.name "daily-report-bot"
          git config user.email "actions@users.noreply.github.com"
          git add backend/app/services/refresh_scheduler.py
          git commit -m "Prioritize deployment warm-set cache jobs"
          git push origin HEAD:ui-cache-validation-20260909
