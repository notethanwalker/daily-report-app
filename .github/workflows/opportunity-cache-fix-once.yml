name: Opportunity Cache Fix Once
on:
  push:
    branches: [opportunity-cache-fix-20260909]
    paths: ['.github/workflows/opportunity-cache-fix-once.yml']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch Opportunity cache path
        run: |
          python - <<'PY'
          from pathlib import Path

          p=Path('backend/app/services/candidate_funnel_v4.py')
          s=p.read_text()
          s=s.replace('from __future__ import annotations\n\nfrom collections import defaultdict', 'from __future__ import annotations\n\nimport asyncio\nfrom collections import defaultdict')
          s=s.replace('from sqlalchemy.orm import Session', 'from sqlalchemy import func\nfrom sqlalchemy.orm import Session')
          s=s.replace('from ..models import FeatureSnapshot, MarketSnapshot, RefreshQueueItem, SymbolRegistry\nfrom ..normalized_market_models import NormalizedDailyBar', 'from ..database import SessionLocal\nfrom ..models import FeatureSnapshot, MarketSnapshot, RefreshQueueItem, SymbolRegistry\nfrom ..normalized_market_models import MarketPipelineState, NormalizedDailyBar')
          s=s.replace('CANDIDATE_MODEL_VERSION="candidate-funnel-v4.9"\nDEEP_ENRICHMENT_LIMIT=25', 'CANDIDATE_MODEL_VERSION="candidate-funnel-v4.10"\nDEEP_ENRICHMENT_LIMIT=25\nCANDIDATE_CACHE_KEY="v4_candidate_funnel_cache"\nCANDIDATE_CACHE_LIMIT=100\nCANDIDATE_CACHE_SECONDS=5*60')
          old='''def _shortlist_bars(db,symbols:list[str],per_symbol:int=90):\n    if not symbols:return {}\n    rows=db.query(NormalizedDailyBar).filter(NormalizedDailyBar.symbol.in_(symbols)).order_by(NormalizedDailyBar.symbol.asc(),NormalizedDailyBar.bar_date.desc()).all();grouped=defaultdict(list)\n    for row in rows:\n        if len(grouped[row.symbol])<per_symbol:grouped[row.symbol].append(row)\n    return {s:list(reversed(v)) for s,v in grouped.items()}\n'''
          new='''def _shortlist_bars(db,symbols:list[str],per_symbol:int=90):\n    if not symbols:return {}\n    ranked=db.query(NormalizedDailyBar.id.label("id"),func.row_number().over(partition_by=NormalizedDailyBar.symbol,order_by=NormalizedDailyBar.bar_date.desc()).label("rn")).filter(NormalizedDailyBar.symbol.in_(symbols)).subquery()\n    rows=db.query(NormalizedDailyBar).join(ranked,NormalizedDailyBar.id==ranked.c.id).filter(ranked.c.rn<=per_symbol).order_by(NormalizedDailyBar.symbol.asc(),NormalizedDailyBar.bar_date.desc()).all();grouped=defaultdict(list)\n    for row in rows:grouped[row.symbol].append(row)\n    return {symbol:list(reversed(values)) for symbol,values in grouped.items()}\n'''
          assert old in s
          s=s.replace(old,new)
          s += '''\n\ndef save_candidate_funnel_cache(db:Session,payload:dict)->None:\n    row=db.get(MarketPipelineState,CANDIDATE_CACHE_KEY)\n    stored={**payload,"cache_written_at":datetime.now(timezone.utc).isoformat()}\n    if row:row.payload=stored\n    else:db.add(MarketPipelineState(key=CANDIDATE_CACHE_KEY,payload=stored))\n    db.commit()\n\ndef get_candidate_funnel_cache(db:Session,limit:int=50)->dict|None:\n    row=db.get(MarketPipelineState,CANDIDATE_CACHE_KEY)\n    if not row or not row.payload:return None\n    payload=dict(row.payload or {});candidates=list(payload.get("candidates") or [])[:limit];payload["candidates"]=candidates;payload["served_from_cache"]=True\n    payload["deep_enrichment_symbols"]=[s for s in (payload.get("deep_enrichment_symbols") or []) if s in {x.get("symbol") for x in candidates}]\n    return payload\n\ndef refresh_candidate_funnel_cache(db:Session,limit:int=CANDIDATE_CACHE_LIMIT)->dict:\n    from .rotation_model_v4 import build_rotation_model\n    payload=build_candidate_funnel(db,build_rotation_model(db),limit=limit,enqueue_enrichment=False)\n    save_candidate_funnel_cache(db,payload);return payload\n\nasync def candidate_snapshot_loop():\n    await asyncio.sleep(5)\n    while True:\n        db=SessionLocal()\n        try:await asyncio.to_thread(refresh_candidate_funnel_cache,db,CANDIDATE_CACHE_LIMIT)\n        except Exception:db.rollback()\n        finally:db.close()\n        await asyncio.sleep(CANDIDATE_CACHE_SECONDS)\n'''
          p.write_text(s)

          p=Path('backend/app/routers/stack_v4.py')
          s=p.read_text()
          s=s.replace('from ..services.candidate_funnel_v4 import build_candidate_funnel, enqueue_deep_enrichment', 'from ..services.candidate_funnel_v4 import build_candidate_funnel, enqueue_deep_enrichment, get_candidate_funnel_cache')
          old='''@router.get("/candidates")\ndef candidates(limit:int=Query(50,ge=1,le=200),db:Session=Depends(get_db),user:str=Depends(current_user)):return build_candidate_funnel(db,build_rotation_model(db),limit=limit,enqueue_enrichment=False)\n'''
          new='''@router.get("/candidates")\ndef candidates(limit:int=Query(50,ge=1,le=200),db:Session=Depends(get_db),user:str=Depends(current_user)):\n    cached=get_candidate_funnel_cache(db,limit)\n    if cached:return cached\n    return build_candidate_funnel(db,build_rotation_model(db),limit=limit,enqueue_enrichment=False)\n'''
          assert old in s
          p.write_text(s.replace(old,new))

          p=Path('backend/app/start.py')
          s=p.read_text()
          s=s.replace('from .services.opportunity_incremental import opportunity_incremental_loop', 'from .services.opportunity_incremental import opportunity_incremental_loop\nfrom .services.candidate_funnel_v4 import candidate_snapshot_loop')
          old='asyncio.create_task(opportunity_incremental_loop());asyncio.create_task(stooq_import_loop())'
          new='asyncio.create_task(opportunity_incremental_loop());asyncio.create_task(candidate_snapshot_loop());asyncio.create_task(stooq_import_loop())'
          assert old in s
          p.write_text(s.replace(old,new))
          PY
      - name: Add regression contract
        run: |
          cat > backend/tests/test_opportunity_cache_contract.py <<'PY'
          from pathlib import Path
          import unittest
          ROOT=Path(__file__).resolve().parents[2]
          FUN=(ROOT/'backend/app/services/candidate_funnel_v4.py').read_text()
          ROUTE=(ROOT/'backend/app/routers/stack_v4.py').read_text()
          START=(ROOT/'backend/app/start.py').read_text()
          class OpportunityCacheContract(unittest.TestCase):
              def test_shortlist_bars_are_limited_in_sql(self):
                  self.assertIn('row_number().over',FUN)
                  self.assertIn('ranked.c.rn<=per_symbol',FUN)
              def test_ui_endpoint_prefers_persisted_snapshot(self):
                  self.assertIn('get_candidate_funnel_cache(db,limit)',ROUTE)
                  self.assertIn('served_from_cache',FUN)
              def test_background_candidate_snapshot_runs(self):
                  self.assertIn('async def candidate_snapshot_loop',FUN)
                  self.assertIn('candidate_snapshot_loop()',START)
          if __name__=='__main__':unittest.main()
          PY
      - name: Validate
        run: |
          pip install -r backend/requirements.txt >/dev/null
          cd backend
          PYTHONDONTWRITEBYTECODE=1 python -m compileall -q app
          PYTHONDONTWRITEBYTECODE=1 python -m unittest discover -s tests -p 'test_*.py'
      - name: Commit intended files
        run: |
          git config user.name "daily-report-bot"
          git config user.email "actions@users.noreply.github.com"
          git add backend/app/services/candidate_funnel_v4.py backend/app/routers/stack_v4.py backend/app/start.py backend/tests/test_opportunity_cache_contract.py
          git commit -m "Serve Opportunity from background candidate cache"
          git push origin HEAD:opportunity-cache-fix-20260909
