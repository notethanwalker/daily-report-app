name: Daily Report Smoke Test

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Wait for Render deploy
        run: sleep 75

      - name: Check current report
        run: |
          set -euo pipefail
          REPORT=$(curl --fail --silent --show-error --retry 5 --retry-delay 5 \
            https://daily-report-api-ero2.onrender.com/api/v1/report/current)
          echo "$REPORT" | jq '{report_date, watchlist_count, market_data_count, missing_market_symbols, verification_summary}'
          echo "$REPORT" | jq -e '.watchlist_count >= 1 and (.markets | type == "array") and (.outliers | type == "array")'

      - name: Persist report snapshot
        run: |
          set -euo pipefail
          SAVED=$(curl --fail --silent --show-error --retry 5 --retry-delay 5 \
            -X POST https://daily-report-api-ero2.onrender.com/api/v1/report/generate)
          echo "$SAVED" | jq '{id, report_date, market_data_count}'
          echo "$SAVED" | jq -e '.id >= 1 and .report_date != null'

      - name: Check report history
        run: |
          set -euo pipefail
          HISTORY=$(curl --fail --silent --show-error --retry 5 --retry-delay 5 \
            'https://daily-report-api-ero2.onrender.com/api/v1/report/history?limit=5')
          echo "$HISTORY" | jq -e '(.reports | length) >= 1'
