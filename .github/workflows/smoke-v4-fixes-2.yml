name: V4 Fix Smoke 2

on:
  push:
    paths:
      - .github/workflows/smoke-v4-fixes-2.yml

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Probe Nasdaq forward earnings endpoints
        continue-on-error: true
        run: |
          H=(-H 'Accept: application/json, text/plain, */*' -H 'User-Agent: Mozilla/5.0' -H 'Origin: https://www.nasdaq.com' -H 'Referer: https://www.nasdaq.com/')
          echo '--- analyst earnings forecast ---'
          curl -L --silent --show-error --max-time 30 "${H[@]}" 'https://api.nasdaq.com/api/analyst/NVDA/earnings-forecast' | jq '{status:.status,data:.data}'
          echo '--- company earnings forecast ---'
          curl -L --silent --show-error --max-time 30 "${H[@]}" 'https://api.nasdaq.com/api/company/NVDA/earnings-forecast' | jq '{status:.status,data:.data}'
          echo '--- calendar symbol parameter ---'
          curl -L --silent --show-error --max-time 30 "${H[@]}" 'https://api.nasdaq.com/api/calendar/earnings?symbol=NVDA' | jq '{status:.status,data:.data}'
          echo '--- info endpoint ---'
          curl -L --silent --show-error --max-time 30 "${H[@]}" 'https://api.nasdaq.com/api/quote/NVDA/info?assetclass=stocks' | jq '{status:.status,data:(.data | {symbol,companyName,primaryData,secondaryData})}'
