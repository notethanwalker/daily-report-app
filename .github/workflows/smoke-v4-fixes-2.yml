name: V4 Fix Smoke 2

on:
  push:
    paths:
      - .github/workflows/smoke-v4-fixes-2.yml

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Health
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --max-time 60 https://daily-report-api-ero2.onrender.com/api/v1/health | jq -e '.status == "ok"'

      - name: Main events calendar
        run: |
          set -euo pipefail
          DATA=$(curl --fail --silent --show-error --max-time 90 'https://daily-report-api-ero2.onrender.com/api/v1/events?days=365&sort=date&order=asc&limit=1200')
          echo "$DATA" | jq '{count,providers,categories,error_count:(.errors|length)}'
          echo "$DATA" | jq -e '(.events|type=="array") and (.count|type=="number") and (.providers|type=="array") and (.categories|type=="array")'

      - name: Portfolio company events deep check
        run: |
          set -euo pipefail
          DATA=$(curl --fail --silent --show-error --max-time 180 'https://daily-report-api-ero2.onrender.com/api/v1/events/tracked-companies?days=365&scope=portfolio&refresh_missing=true&max_refresh=60')
          echo "$DATA" | jq '{count,tracked_symbols,portfolio_symbols,refreshed_symbols,deferred_symbols,unresolved_symbols,errors,events}'
          echo "$DATA" | jq -e '(.events|type=="array") and (.portfolio_symbols|type=="array")'

      - name: Research workspace SNDK
        run: |
          set -euo pipefail
          DATA=$(curl --fail --silent --show-error --max-time 120 'https://daily-report-api-ero2.onrender.com/api/v1/security/SNDK/workspace')
          echo "$DATA" | jq '{symbol,data_state,hydrated,history_state,price:.market.price,as_of:.market.as_of}'
          echo "$DATA" | jq -e '.symbol == "SNDK" and (.market|type=="object") and (.market.price != null) and has("data_state") and has("history_state")'
