name: Williams Priority Historical Sentiment

on:
  push:
    paths:
      - '.github/workflows/williams-priority-historical-sentiment.yml'
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install market data client
        run: python -m pip install --disable-pip-version-check yfinance
      - name: Write article-derived baskets
        shell: bash
        run: |
          python - <<'PY'
          import json
          baskets = {
            '2010': [
              {'article':'TheStreet — Five Market Generals (May 12, 2010)','symbols':['DECK','ISRG','CRM','CMG','AAPL']},
              {'article':'TheStreet — 7 Sweet Stocks for the Next Selloff (Jun 3, 2010)','symbols':['CMG','AAPL','NFLX','DECK','ISRG','ESRX','CRM']},
              {'article':'TheStreet — 5 Best Fast-Growth Stocks to Buy (Sep 23, 2010)','symbols':['DLTR','WCN','OKS','NVO','MNRO']},
              {'article':'TheStreet — Five Fast-Growth Companies to Own in 2010 (Jan 5, 2010)','symbols':['TEVA','ORLY','LINC','NEOG','ATGE']},
              {'article':'Fortune/CNNMoney — 100 Fastest-Growing Companies 2010, largest-ranked names with continuous company histories','symbols':['AAPL','SNEX','AMZN','FLR','BB','CYH','GILD','MA','BIIB','CTSH']}
            ],
            '2017': [
              {'article':'Fortune — 6 Best Tech Stocks to Buy Now (May 18, 2017)','symbols':['GOOGL','TSLA','AMZN','AVGO','ADBE','NVDA']},
              {'article':'Forbes — These 5 Stocks Could Double Your Retirement Nest Egg (Jan 7, 2017)','symbols':['INTC','GM','FAF','AMT','SKT']},
              {'article':'Forbes — 5 Dividend Growth Stocks That Could Double in 5 Years (Sep 4, 2017)','symbols':['INTU','FRME','MA','LUV','RCL']},
              {'article':'Kiplinger — James K. Glassman 10 Stock Picks for 2017','symbols':['TTWO','HSIC','CVU','CRM','MU','SBUX','KHC','SPG','SNY','AMZN']},
              {'article':'Kiplinger — 10 Best Dividend-Paying Stocks for 2017','symbols':['ABBV','T','CVX','F','GM','IP','MRK','PFE','VZ','WFC']}
            ]
          }
          open('historical_sentiment_baskets.json','w').write(json.dumps(baskets,indent=2))
          print(json.dumps(baskets,indent=2))
          PY
      - name: Run 2010-2016 article baskets
        shell: bash
        run: |
          python - <<'PY'
          import json, subprocess
          b=json.load(open('historical_sentiment_baskets.json'))['2010']
          for i,item in enumerate(b,1):
              subprocess.check_call(['python','scripts/williams_portfolio_priority.py','--symbols',','.join(item['symbols']),'--start','2010-01-01','--end','2016-12-30','--monthly-cash','10000','--tilts','0.25,0.5,0.75,1.0','--output',f'sentiment_2010_{i}.json'])
          PY
      - name: Run 2017-current article baskets
        shell: bash
        run: |
          python - <<'PY'
          import json, subprocess
          b=json.load(open('historical_sentiment_baskets.json'))['2017']
          for i,item in enumerate(b,1):
              subprocess.check_call(['python','scripts/williams_portfolio_priority.py','--symbols',','.join(item['symbols']),'--start','2017-01-01','--end','2026-09-04','--monthly-cash','10000','--tilts','0.25,0.5,0.75,1.0','--output',f'sentiment_2017_{i}.json'])
          PY
      - name: Summarize
        shell: bash
        run: |
          python - <<'PY'
          import json, glob
          baskets=json.load(open('historical_sentiment_baskets.json'))
          out={'2010':[],'2017':[]}
          for group,patt in [('2010','sentiment_2010_*.json'),('2017','sentiment_2017_*.json')]:
              for i,fn in enumerate(sorted(glob.glob(patt)),1):
                  d=json.load(open(fn)); meta=baskets[group][i-1]
                  row={'article':meta['article'],'symbols':d['symbols'],'equal_value':d['results']['equal']['portfolio_value']}
                  for k in ['tilt_25','tilt_50','tilt_75','tilt_100']:
                      row[k]=d['results'][k]['vs_equal_pct']
                  out[group].append(row)
          print(json.dumps(out,indent=2))
          open('historical_sentiment_summary.json','w').write(json.dumps(out,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: williams-priority-historical-sentiment
          path: |
            historical_sentiment_baskets.json
            historical_sentiment_summary.json
            sentiment_2010_*.json
            sentiment_2017_*.json
          retention-days: 30
