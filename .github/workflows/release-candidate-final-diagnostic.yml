name: Final Live HTTP Diagnostic
on:
  push:
    branches: [release-candidate-20260909]
    paths: ['.github/workflows/release-candidate-final-diagnostic.yml']
permissions:
  contents: read
jobs:
  diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Create temporary test account
        run: |
          set -euo pipefail
          EMAIL="rc-diag-${GITHUB_RUN_ID}@example.invalid"
          PASS="$(openssl rand -hex 18)"
          printf '%s' "$EMAIL" >/tmp/rc-email
          printf '%s' "$PASS" >/tmp/rc-pass
          curl --fail --silent --show-error -H 'Content-Type: application/json' -d "{\"email\":\"$EMAIL\",\"password\":\"$PASS\"}" https://daily-report-api-ero2.onrender.com/api/v1/auth/register >/dev/null
      - name: Wait for approval
        run: |
          set -euo pipefail
          EMAIL="$(cat /tmp/rc-email)"; PASS="$(cat /tmp/rc-pass)"
          for i in {1..60}; do
            CODE=$(curl --silent --output /dev/null --write-out '%{http_code}' -H 'Content-Type: application/json' -d "{\"email\":\"$EMAIL\",\"password\":\"$PASS\"}" https://daily-report-api-ero2.onrender.com/api/v1/auth/login || true)
            [ "$CODE" = "200" ] && exit 0
            sleep 5
          done
          exit 1
      - name: Build and start exact candidate
        working-directory: web
        env:
          BACKEND_INTERNAL_URL: https://daily-report-api-ero2.onrender.com
        run: |
          npm install
          npm install --no-save playwright
          npm run build
          npx playwright install chromium
          nohup npm start -- -p 3000 >/tmp/rc-next.log 2>&1 &
          for i in {1..60}; do curl -fsS http://127.0.0.1:3000 >/dev/null && exit 0; sleep 1; done
          cat /tmp/rc-next.log; exit 1
      - name: Trace desktop and mobile HTTP failures
        working-directory: web
        run: |
          cat > live-diag.mjs <<'JS'
          import fs from 'node:fs';
          import {chromium} from 'playwright';
          const email=fs.readFileSync('/tmp/rc-email','utf8');
          const password=fs.readFileSync('/tmp/rc-pass','utf8');
          const browser=await chromium.launch({headless:true});
          const failures=[];
          for(const [width,height] of [[1440,1000],[390,844]]){
            const ctx=await browser.newContext({viewport:{width,height}});
            const page=await ctx.newPage();
            const bad=[]; const pageErrors=[];
            page.on('response',r=>{if(r.status()>=400)bad.push(`${r.status()} ${r.url()}`)});
            page.on('pageerror',e=>pageErrors.push(String(e)));
            await page.goto('http://127.0.0.1:3000/v4',{waitUntil:'domcontentloaded',timeout:30000});
            await page.getByLabel('Email').fill(email); await page.getByLabel('Password').fill(password); await page.locator('button.auth-primary').click();
            const name=page.getByLabel('Name'), stack=page.getByRole('heading',{name:'Decision Stack'});
            await Promise.race([name.waitFor({state:'visible',timeout:20000}).catch(()=>null),stack.waitFor({state:'visible',timeout:20000}).catch(()=>null)]);
            if(await name.isVisible().catch(()=>false)){await name.fill('Release Test');await page.getByRole('button',{name:'Continue'}).click()}
            await stack.waitFor({timeout:20000});
            await page.getByRole('button',{name:/Macro/}).click();
            await page.waitForFunction(()=>/[1-9]\d* groups\b/.test(document.querySelector('main')?.innerText||''),null,{timeout:25000});
            await page.getByRole('button',{name:/Opportunity/}).click();
            await page.waitForFunction(()=>/[1-9]\d* shown\b/.test(document.querySelector('main')?.innerText||''),null,{timeout:25000});
            await page.getByRole('button',{name:/Deployment/}).click();
            await page.waitForTimeout(3000);
            const unexpected=bad.filter(x=>!(/^401 .*\/auth\/session(?:\?|$)/.test(x)));
            if(unexpected.length)failures.push(`${width}:${unexpected.join('|')}`);
            if(pageErrors.length)failures.push(`${width}:page:${pageErrors.join('|')}`);
            await ctx.close();
          }
          await browser.close();
          if(failures.length){console.error(failures.join('\n'));process.exit(1)}
          console.log('FINAL_DIAGNOSTIC_OK');
          JS
          node live-diag.mjs
