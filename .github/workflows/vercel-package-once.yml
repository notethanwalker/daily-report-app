name: Vercel Package Once
on:
  push:
    branches: [ui-cache-validation-20260909]
    paths: ['.github/workflows/vercel-package-once.yml']
permissions:
  contents: write
jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Archive web source
        run: tar -czf vercel-web-source.tgz web
      - name: Publish temporary archive on this branch
        run: |
          git config user.name "daily-report-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -f vercel-web-source.tgz
          git commit -m "Publish temporary Vercel source archive"
          git push origin HEAD:ui-cache-validation-20260909
